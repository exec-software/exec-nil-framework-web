name: Source security audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/source-scanner"
          cd "$RUNNER_TEMP/source-scanner"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output scanner.tar.gz
          printf '%s  scanner.tar.gz\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb | sha256sum --check -
          tar -xzf scanner.tar.gz gitleaks
      - name: Scan the working tree and the fetched history
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/source-scanner/gitleaks" dir . --no-banner --redact
          "$RUNNER_TEMP/source-scanner/gitleaks" git . --no-banner --redact
      - name: Refuse absolute paths, addresses and contact details
        shell: bash
        run: |
          set -euo pipefail
          # A framework's source has no business naming a developer's home
          # directory, a machine on anyone's network, or a person. Findings
          # are printed as counts and paths, never as the matching line.
          if git grep -nIE '/home/[a-z]|/Users/[A-Za-z]|[0-9]{1,3}(\.[0-9]{1,3}){3}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' \
               -- . ':(exclude).github/workflows/audit.yml' > /dev/null 2>&1; then
            echo "Found an absolute path, an IP address or an email address in:"
            git grep -lIE '/home/[a-z]|/Users/[A-Za-z]|[0-9]{1,3}(\.[0-9]{1,3}){3}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' \
               -- . ':(exclude).github/workflows/audit.yml'
            exit 1
          fi
      # Scan reports are not uploaded. Even redacted findings can expose
      # filenames, commit messages and surrounding source context.
